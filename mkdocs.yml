# CareFlow documentation site (MkDocs Material, free and open source).
#   pip install -r docs/requirements.txt
#   mkdocs serve            -> http://localhost:8001
#   mkdocs build --strict   -> site/ (fails on any warning or broken link)
# Reference tables under docs/reference/generated/ come from the code: run `python scripts/gen_docs.py` first.

site_name: CareFlow
site_description: Administrative discharge clearance for hospitals. Documentation for staff, IT and developers.
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8001

# "Edit this page" links appear once the repository exists. Set both, for example:
#   CAREFLOW_DOCS_REPO_URL=https://github.com/<you>/careflow   CAREFLOW_DOCS_EDIT_URI=edit/main/docs/
repo_url: !ENV [CAREFLOW_DOCS_REPO_URL]
edit_uri: !ENV [CAREFLOW_DOCS_EDIT_URI, ""]

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  /_audit.md

